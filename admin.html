<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI智能教室调研 · 数据后台</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  <style>
    :root { --primary: #1D9E75; --primary-dark: #0F6E56; --coral: #D85A30; --amber: #BA7517; --purple: #7F77DD; --blue: #378ADD; --bg: #F0F2F5; --card: #FFFFFF; --text: #1a1a18; --text-muted: #666; --border: #e0e0e0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); }
    .header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white; padding: 25px 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
    .header h1 { font-size: 26px; margin-bottom: 8px; }
    .header p { opacity: 0.9; font-size: 14px; }
    .status-bar { padding: 10px 30px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .status-ok { background: #E8F5E9; color: #2E7D32; }
    .status-err { background: #FFEBEE; color: #C62828; }
    .container { max-width: 1600px; margin: 0 auto; padding: 20px 30px 30px; }
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); text-align: center; }
    .stat-card .value { font-size: 32px; font-weight: 700; color: var(--primary); }
    .stat-card .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    .dual-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .panel-card { background: var(--card); border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); padding: 20px; }
    .panel-card h3 { font-size: 15px; margin-bottom: 14px; color: var(--text); }
    .mini-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .mini-table th, .mini-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    .mini-table th { color: var(--text-muted); font-weight: 600; font-size: 11px; }
    .chart-wrap { height: 260px; position: relative; }
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .chart-box { background: var(--card); border-radius: 10px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
    .chart-box h3 { font-size: 15px; margin-bottom: 12px; }
    .chart-c { height: 240px; }
    .table-section { background: var(--card); border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); overflow: auto; margin-top: 24px; }
    .table-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #fafafa; font-weight: 600; color: var(--text-muted); font-size: 11px; }
    .tag { display: inline-block; padding: 2px 8px; background: #E8F5E9; color: #2E7D32; border-radius: 10px; font-size: 11px; margin: 1px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: var(--coral); color: white; margin-left: 6px; }
    .btn-danger:hover { opacity: 0.85; }
    .empty-state { text-align: center; padding: 30px; color: var(--text-muted); }
    @media (max-width: 900px) { .dual-panel { grid-template-columns: 1fr; } .stats-row { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .stats-row { grid-template-columns: 1fr; } .chart-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="header">
  <h1>AI智能教室建设 · 教师需求调研</h1>
  <p>数据后台 — 实时查看教师反馈与统计</p>
  <button class="btn btn-primary" onclick="exportPDF()" style="margin-top:12px;background:#fff;color:#0F6E56;font-weight:600">📄 导出核心报告 PDF</button>
</div>
<div id="statusBar" class="status-bar status-ok">数据加载中...</div>

<div class="container">
  <div class="stats-row">
    <div class="stat-card"><div class="value" id="total-count">0</div><div class="label">总问卷数</div></div>
    <div class="stat-card"><div class="value" id="recent-count">0</div><div class="label">最近7天</div></div>
    <div class="stat-card"><div class="value" id="subject-count">0</div><div class="label">参与学科</div></div>
    <div class="stat-card"><div class="value" id="avg-willingness">-</div><div class="label">平均参与意愿 (1-5)</div></div>
  </div>

  <div class="section-title">大屏一体机功能需求</div>
  <div class="dual-panel">
    <div class="panel-card"><h3>功能频次统计</h3><div style="max-height:260px;overflow-y:auto"><table class="mini-table" id="tbl-bigscreen"><thead><tr><th>功能项</th><th>次数</th></tr></thead><tbody></tbody></table></div></div>
    <div class="panel-card"><h3>需求分布</h3><div class="chart-wrap"><canvas id="ch-bigscreen"></canvas></div></div>
  </div>

  <div class="section-title">AI赋能课堂需求</div>
  <div class="dual-panel">
    <div class="panel-card"><h3>功能频次统计</h3><div style="max-height:260px;overflow-y:auto"><table class="mini-table" id="tbl-ai"><thead><tr><th>功能项</th><th>次数</th></tr></thead><tbody></tbody></table></div></div>
    <div class="panel-card"><h3>需求分布</h3><div class="chart-wrap"><canvas id="ch-ai"></canvas></div></div>
  </div>

  <div class="section-title">学生iPad功能需求</div>
  <div class="dual-panel">
    <div class="panel-card"><h3>功能频次统计</h3><div style="max-height:260px;overflow-y:auto"><table class="mini-table" id="tbl-ipad"><thead><tr><th>功能项</th><th>次数</th></tr></thead><tbody></tbody></table></div></div>
    <div class="panel-card"><h3>需求分布</h3><div class="chart-wrap"><canvas id="ch-ipad"></canvas></div></div>
  </div>

  <div class="section-title">担忧与顾虑</div>
  <div class="dual-panel">
    <div class="panel-card"><h3>顾虑频次统计</h3><div style="max-height:260px;overflow-y:auto"><table class="mini-table" id="tbl-concerns"><thead><tr><th>顾虑项</th><th>次数</th></tr></thead><tbody></tbody></table></div></div>
    <div class="panel-card"><h3>顾虑分布</h3><div class="chart-wrap"><canvas id="ch-concerns"></canvas></div></div>
  </div>

  <div class="section-title">数据统计</div>
  <div class="chart-grid">
    <div class="chart-box"><h3>学科分布</h3><div class="chart-c"><canvas id="subjectChart"></canvas></div></div>
    <div class="chart-box"><h3>教龄分布</h3><div class="chart-c"><canvas id="experienceChart"></canvas></div></div>
    <div class="chart-box"><h3>年级分布</h3><div class="chart-c"><canvas id="gradeChart"></canvas></div></div>
    <div class="chart-box"><h3>参与意愿</h3><div class="chart-c"><canvas id="willingnessChart"></canvas></div></div>
  </div>

  <div class="table-section">
    <div class="table-header">
      <span style="font-weight:600">问卷记录</span>
      <button class="btn btn-primary" onclick="loadData()">刷新数据</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>提交时间</th><th>学科</th><th>教龄</th><th>年级</th>
            <th>AI赋能需求</th><th>iPad态度</th><th>参与意愿</th><th>建议</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
var stats = {}, allData = [];
var charts = {};

function status(msg, ok) {
  var bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = 'status-bar ' + (ok ? 'status-ok' : 'status-err');
}

async function loadData() {
  try {
    var TK='a8b34e76a03b049c89756d8ca26c7e9b';
    var API='https://gitee.com/api/v5/repos/xyjun_1_0/ai-classroom-survey/contents/data.json?access_token='+TK;
    var r = await fetch(API);
    if(!r.ok)throw new Error('Gitee '+r.status);
    var cur = await r.json();
    var raw=atob(cur.content),bytes=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    allData = JSON.parse(new TextDecoder().decode(bytes))||[];
    var wk=Date.now()-7*86400000;
    stats={total:allData.length,recent_7_days:0,by_subject:{},by_experience:{},by_grade:{},big_screen:{},ai_features:{},ipad_features:{},ipad_need:{},ipad_worry:{},support:{},willingness:{}};
    var cnt=function(o,a){if(Array.isArray(a))a.forEach(function(v){o[v]=(o[v]||0)+1})};
    allData.forEach(function(d){
      if(d.timestamp&&new Date(d.timestamp).getTime()>=wk)stats.recent_7_days++;
      cnt(stats.by_subject,d.q1);cnt(stats.by_experience,d.q2);cnt(stats.by_grade,d.q3);
      ['q7a','q7b','q7c','q7d'].forEach(function(k){cnt(stats.big_screen,d[k])});
      ['q9a','q9b','q9c','q9d','q9'].forEach(function(k){cnt(stats.ai_features,d[k])});
      ['q11a','q11b','q11c','q11d','q11e'].forEach(function(k){cnt(stats.ipad_features,d[k])});
      cnt(stats.ipad_need,d.q10);cnt(stats.ipad_worry,d.q12);cnt(stats.support,d.q14);
      if(d.q15)stats.willingness[d.q15]=(stats.willingness[d.q15]||0)+1;
    });
    updateCards();
    renderDualPanel('big_screen', 'tbl-bigscreen', 'ch-bigscreen');
    renderDualPanel('ai_features', 'tbl-ai', 'ch-ai');
    renderDualPanel('ipad_features', 'tbl-ipad', 'ch-ipad');
    renderDualPanel('ipad_worry', 'tbl-concerns', 'ch-concerns');
    renderDemographics();
    renderTable();
    status('数据加载成功 · ' + allData.length + ' 条记录', true);
  } catch(e) {
    status('加载失败: ' + e.message, false);
  }
}

function updateCards() {
  document.getElementById('total-count').textContent = stats.total || 0;
  document.getElementById('recent-count').textContent = stats.recent_7_days || 0;
  document.getElementById('subject-count').textContent = Object.keys(stats.by_subject||{}).length;
  var w = stats.willingness || {};
  var t=0, c=0;
  Object.entries(w).forEach(function(e) { t += parseInt(e[0])*e[1]; c += e[1]; });
  document.getElementById('avg-willingness').textContent = c>0 ? (t/c).toFixed(1) : '-';
}

function renderDualPanel(key, tblId, chId) {
  var data = stats[key] || {};
  var sorted = Object.entries(data).sort(function(a,b) { return b[1]-a[1]; });
  var tbody = document.getElementById(tblId).querySelector('tbody');
  tbody.innerHTML = sorted.map(function(x) { return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>'; }).join('') || '<tr><td colspan="2" class="empty-state">暂无数据</td></tr>';
  var labels = sorted.map(function(x) { return x[0]; });
  var values = sorted.map(function(x) { return x[1]; });
  var colors = ['#1D9E75','#378ADD','#D85A30','#BA7517','#7F77DD','#9B59B6','#3498DB','#1ABC9C','#E67E22','#2ECC71'];
  if (charts[chId]) charts[chId].destroy();
  var ctx = document.getElementById(chId).getContext('2d');
  charts[chId] = new Chart(ctx, {
    type: 'bar', indexAxis: 'y',
    data: { labels: labels, datasets: [{ data: values, backgroundColor: labels.map(function(_,i) { return colors[i%colors.length]; }) }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { stepSize: 1 } } } }
  });
}

function renderDemographics() {
  var colors = ['#1D9E75','#378ADD','#D85A30','#BA7517','#7F77DD','#9B59B6','#3498DB','#1ABC9C'];
  [{id:'subjectChart',data:stats.by_subject,type:'pie'},
   {id:'experienceChart',data:stats.by_experience,type:'bar',color:'#1D9E75'},
   {id:'gradeChart',data:stats.by_grade,type:'doughnut'},
   {id:'willingnessChart',data:stats.willingness,type:'bar',color:'#7F77DD'}].forEach(function(cfg) {
    var d = cfg.data || {};
    var labels = Object.keys(d), values = Object.values(d);
    if (charts[cfg.id]) charts[cfg.id].destroy();
    var ctx = document.getElementById(cfg.id).getContext('2d');
    charts[cfg.id] = new Chart(ctx, {
      type: cfg.type,
      data: { labels: labels, datasets: [{ data: values, backgroundColor: cfg.type==='bar'?cfg.color:colors.slice(0,labels.length) }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: cfg.type==='bar'?{display:false}:{position:'bottom'} } }
    });
  });
}

function renderTable() {
  var tbody = document.getElementById('tableBody');
  if (allData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty-state">暂无数据</td></tr>';
    return;
  }
  tbody.innerHTML = allData.map(function(item) {
    var ts = (item.timestamp||'').substring(0,16);
    var q1 = (item.q1||[]).slice(0,2).join(', ') || '-';
    var q2 = item.q2 ? item.q2[0] : '-';
    var q3 = item.q3 ? item.q3[0] : '-';
    var q9 = (item.q9a||item.q9||[]).slice(0,2).join(', ') || '-';
    var q10 = item.q10 ? item.q10[0] : '-';
    var q15 = item.q15 || '-';
    var q16 = (item.q16||'').substring(0,15) || '-';
    return '<tr>' +
      '<td>'+item.id+'</td>' +
      '<td>'+ts+'</td>' +
      '<td>'+q1+'</td>' +
      '<td>'+q2+'</td>' +
      '<td>'+q3+'</td>' +
      '<td>'+q9+'</td>' +
      '<td>'+q10+'</td>' +
      '<td>'+q15+'</td>' +
      '<td>'+q16+'</td>' +
      '<td><button class=\"btn btn-danger\" onclick=\"del('+item.id+')\">删除</button></td>' +
      '</tr>';
  }).join('');
}

async function del(id) {
  if (!confirm('确认删除记录 #'+id+'?')) return;
  try {
    var r = await fetch(API+'/data/'+id, { method: 'DELETE' });
    if (r.ok) { loadData(); } else { alert('删除失败'); }
  } catch(e) { alert('删除失败: '+e.message); }
}

function exportPDF(){
  status('正在生成PDF...',true);
  var titles=['大屏一体机功能需求','AI赋能课堂需求','学生iPad功能需求','担忧与顾虑'];
  var tables=['tbl-bigscreen','tbl-ai','tbl-ipad','tbl-concerns'];
  var canvases=['ch-bigscreen','ch-ai','ch-ipad','ch-concerns'];

  var modal=document.createElement('div');modal.id='pdf-modal';
  modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:99999;overflow-y:auto;padding:30px;font-family:\"Microsoft YaHei\",sans-serif';
  var h='<h1 style=\"text-align:center;color:#0F6E56;font-size:20px\">AI智能教室建设 · 教师需求调研核心报告</h1>';
  h+='<p style=\"text-align:center;font-size:12px;color:#999;margin-bottom:20px\">共 '+allData.length+' 条问卷数据 | '+new Date().toLocaleString('zh-CN')+'</p>';
  for(var i=0;i<4;i++){
    h+='<h2 style=\"font-size:15px;color:#0F6E56;border-bottom:2px solid #1D9E75;padding-bottom:4px;margin-top:20px\">'+titles[i]+'</h2>';
    var tb=document.getElementById(tables[i]);
    if(tb){ var c=tb.cloneNode(true);c.style.width='100%';c.style.borderCollapse='collapse';c.style.fontSize='11px';
      c.querySelectorAll('th').forEach(function(e){e.style.background='#0F6E56';e.style.color='#fff';e.style.padding='4px 8px';e.style.textAlign='left'});
      c.querySelectorAll('td').forEach(function(e){e.style.padding='3px 8px';e.style.borderBottom='1px solid #eee'});
      h+=c.outerHTML; }
    var cv=document.getElementById(canvases[i]);
    if(cv){ var img=new Image();img.src=cv.toDataURL('image/png');img.style.width='100%';img.style.maxWidth='550px';img.style.display='block';img.style.margin='8px auto';
      var wrap=document.createElement('div');wrap.appendChild(img);h+=wrap.innerHTML; }
  }
  modal.innerHTML=h;document.body.appendChild(modal);

  html2pdf().set({margin:[8,8,8,8],filename:'AI智能教室调研核心报告.pdf',image:{type:'jpeg',quality:0.92},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(modal).save().then(function(){
    document.body.removeChild(modal);status('PDF导出成功',true);
  }).catch(function(e){
    document.body.removeChild(modal);status('导出失败: '+e.message,false);
  });
}

loadData();
</script>
</body>
</html>
