<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提交成功 - AI智能教室调研</title>
<style>
  :root {
    --teal: #1D9E75;
    --teal-dark: #0F6E56;
    --bg: #F7F8F6;
    --card: #FFFFFF;
    --text: #1a1a18;
    --text-muted: #6b6b66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 48px 32px;
    text-align: center;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
  }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal-dark), var(--teal));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 32px;
    color: #fff;
  }
  h1 { font-size: 22px; margin-bottom: 12px; }
  p { font-size: 14px; color: var(--text-muted); line-height: 1.7; }
  .btn {
    display: inline-block;
    margin-top: 28px;
    padding: 12px 32px;
    background: var(--teal);
    color: #fff;
    border-radius: 99px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="card">
  <div class="check">✓</div>
  <h1>提交成功</h1>
  <p>感谢您参与AI智能教室建设需求调研！<br>您的反馈将为学校采购决策提供重要参考。</p>
  <a class="btn" href="/survey.html">返回问卷</a>
</div>
</body>
</html>
